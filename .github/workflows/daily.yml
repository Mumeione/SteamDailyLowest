# 每日史低日报（对应 .scratch/deploy/spec.md、.scratch/refactor-2026q4/spec.md §3.6 与 docs/DEVELOPMENT.md §8）
#
# 入口（cron 是 UTC，GitHub 不认 timezone 字段）：
#   14 19 * * *  每日 03:14 Asia/Shanghai  主任务：抓取 → 报表 → Pages 发布 → 状态回写 data 分支
#   21 21 * * *  每日 05:21 Asia/Shanghai  补跑：daily-guard 检测到 12h 内已有成功的定时主任务则跳过
#   14 7 * * *   每日 15:14 Asia/Shanghai  预抓：run.py --prefetch，纯 state 派生补详情缓存、不出报表（S8 起不扫描折扣列表）
#   14 7 2 * *   每月 2 日 15:14           orphan 清理：data 分支历史清零（只留当前一版）
#                                          + 清掉 7 天前的 Pages 部署记录（见该 job 注释）
#   workflow_dispatch                    手动触发：主任务与预抓都跑（并发组串行排队）
#
# 定时全部避开整点：官方文档写明「整点是 Actions 高负载时刻，调度可能被推迟甚至丢弃」。
# 实测 0 19 * * *（03:00 CST，美区下午峰顶）排队 2h48m；05:14 CST 美东临近下班、
# 07:24/15:14 CST 落在全球低谷，靠补跑兜底主跑被丢弃的场次。
# 主跑原定 05:14（2026-09-25 实测延迟 2h38m 送达），用户裁决提前到 03:14（距补跑 2h07m），
# 该时段靠美区下午峰顶、延迟可能更大，但丢弃与时刻无必然联系，仍由补跑兜底。
#
# §8 的四个坑在这里的处理方式：
#   1. GITHUB_TOKEN 推的 commit 不触发 Pages 构建 → 发布用 deploy-pages 在同一次运行内完成
#   2. 公开仓库 60 天无活动会禁用定时任务 → 每日回写 data 分支正好持续产生活动
#   3. runner 无持久磁盘 → 状态 JSON 提交回 data 分支
#   4. main 的 .gitignore 直接整体忽略 data/（状态由 data 分支持有，不再依赖取反写法）
#
# S8（2026-10）在本文件落地的项（spec §3.6「S8 修订」）：
#   ① timeout-minutes：主跑 90 · 预抓 60 · guard 5 · 清理 10 · 告警 5（此前吃默认 360 分钟）
#   ② 失败自动开 GitHub Issue（alert job，按 run.py 退出码分级，同日同因去重）
#   ③ run.py 写 $GITHUB_STEP_SUMMARY 指标表 + 阶段墙钟（见 run.py）
#   ④ permissions 顶层清零、按 job 最小化
#   ⑤ data 回写 push 前 pull --rebase（抽进 composite action，probe.yml 同款语义）
#   ⑥ daily/prefetch 的状态恢复与回写重复块抽成 .github/actions/{state-restore,data-writeback}
#   ⑦ actions 全部升到 Node 24 运行时的当前主版本（Node 20 已于 2026-09-23 退役）
#   报表发布韧性（Q3）：「打包报表 / 发布 Pages」用 always() + hashFiles 兜底——
#   run.py 详情阶段失败（退出码 5）时首版报表照常发布，页面永远可见；失败 run 不计
#   guard 的「成功定时 daily」，05:21 补跑照常重试详情，成功后完整版覆盖发布。
#
# 每月 2 日的 14 7 UTC，预抓与 orphan 清理会同时命中：二者都进 state-write 并发组串行排队，
# 且 orphan 清理只清历史、保留当前 state.json 内容，互相不会丢数据。
#
# ⚠️ 本文件**不跑测试**：pytest / check_payload / jsdom 冒烟在 checks.yml（2026-10-09）。
#   分工是「daily = 发布（要打真实请求）· checks = 契约锁（零网络）」。checks 目前
#   是**手动触发**（用户每次都本地跑齐再提交，不想每天堆 Actions 记录）；所以别指望
#   它拦住坏提交，也别往 daily 里加测试步骤 —— 那会让每次发布多背一套依赖，
#   而且失败语义混在一起。

name: daily

on:
  schedule:
    - cron: "14 19 * * *"
    - cron: "21 21 * * *"
    - cron: "14 7 * * *"
    - cron: "14 7 2 * *"
  workflow_dispatch: {}

# 顶层清零，各 job 显式申请最小权限（S8 ④）
permissions: {}

# 主任务与预抓都写 data 分支，串行排队防并发写坏状态
concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  daily-guard:
    # 补跑守门：只在 05:21 的补跑触发时执行。过去 12 小时内已有一次成功的定时 daily
    # （主跑或上一轮补跑）就跳过补跑 —— 状态库幂等不会坏，但能省一整轮
    # 抓取（约 130 次 ITAD 请求 + Pages 发布）。
    if: github.event.schedule == '21 21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read        # gh run list 查近 12h 的运行记录
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ⚠️ 不能按「UTC 当天」过滤：主跑 03:14 CST = 19:14 UTC（UTC 前一天），
          # 补跑会看不到它。主跑 19:14 UTC 与补跑 21:21 UTC 相距 2h07m，
          # 用 12 小时窗口既覆盖主跑、又不会把 24 小时前的上一轮补跑算进来。
          since=$(date -u -d "12 hours ago" +"%Y-%m-%dT%H:%M:%SZ")
          count=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily.yml \
            --event schedule --status success --created ">=$since" \
            --json databaseId --jq 'length')
          echo "过去 12 小时（自 ${since}）已有 ${count} 次成功的定时 daily 运行"
          if [ "$count" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  daily:
    # 串行化（根因 C 修复，2026-10-04 随重构覆盖重新引入）：daily 必须等 prefetch
    # 写完 data 分支再跑 —— 同 run 内两个 job 并行 push 会非快进冲突（10-02 实锤）
    needs: [prefetch, daily-guard]
    # needs 的 job 因 if 为假被 skip 时，依赖它的 job 会被连带 skip（GitHub 规则）。
    # guard 的 if 只在补跑 cron 时为真，主跑/手动触发下 guard 必被跳过，
    # 故必须用 always() 解耦，否则主跑永远被连坐杀掉（2026-09-24 实锤过一次）。
    # 补跑路径仍要求 guard 真实执行过（result == 'success'）且未判 skip。
    if: >-
      always() && (
        github.event_name == 'workflow_dispatch' ||
        github.event.schedule == '14 19 * * *' ||
        (github.event.schedule == '21 21 * * *' &&
          needs.daily-guard.result == 'success' &&
          needs.daily-guard.outputs.skip == 'false')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write      # 状态回写 data 分支
      pages: write         # Pages 发布
      id-token: write      # deploy-pages 的 OIDC
    outputs:
      run_exit_code: ${{ steps.run_daily.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      - name: 取出 data 分支（状态库持久层）
        uses: actions/checkout@v7
        with:
          ref: data
          path: statedata
          # S8 review P1-3：回写要跑 pull --rebase，浅克隆（默认 depth=1）rebase
          # 遇远端推进可能缺基线对象；data 分支每月 orphan 清零，全量深度可控
          fetch-depth: 0

      - name: 恢复状态文件
        uses: ./.github/actions/state-restore

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: pip install requests jinja2

      - name: 生成运行配置（key 走 secrets 环境变量，config.py 已支持覆盖）
        run: cp config.example.json config.json

      - name: 日常抓取与报表
        id: run_daily
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
        # 捕获 run.py 退出码再原样上抛：0 成功 · 1 未预期 · 2 配置 · 3 封禁 ·
        # 4 请求失败（仅报表产出前） · 5 详情阶段失败（首版已兜底）
        run: |
          set +e
          python run.py
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Pages 配置
        uses: actions/configure-pages@v6

      - name: 打包报表
        id: package
        # S8 报表发布韧性：run.py 详情阶段失败（退出码 5）时，output/ 里已有
        # 步骤 5 的首版报表 → 照常打包发布（页面永远可见）。用 !cancelled()
        # 而非 always()（review-s8 P1-2）：手动取消 / 超时连带取消时发布
        # 半成品没有意义；只有「连首版都没渲染出来」（列表阶段就挂了）才没有
        # artifact 可传。
        if: ${{ !cancelled() && hashFiles('output/index.html') != '' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: output

      - name: 发布 Pages（必须在同一次运行内，§8 坑 1）
        id: deployment
        if: ${{ !cancelled() && steps.package.conclusion == 'success' }}
        uses: actions/deploy-pages@v5

      - name: 状态回写 data 分支（§8 坑 3）
        # 这里保留 always()（与打包/发布的 !cancelled() 有意不同）：取消场景下
        # 已攒库/已抓一半的状态写回去，下一轮断点续传受益（fetch_details 本就
        # 按 DETAIL_SAVE_EVERY 周期落盘）。
        if: always() && hashFiles('data/state.json') != ''
        uses: ./.github/actions/data-writeback
        with:
          message: "state + snapshot $(date -u +%F)"

  cleanup-data-branch:
    if: github.event.schedule == '14 7 2 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # force-push 重置 data 分支
      deployments: write   # 删旧的 Pages 部署记录（见下面第二步）
    steps:
      - uses: actions/checkout@v7
        with:
          ref: data

      - name: orphan 重置 —— 历史清零、只留当前一版（用户裁决：json 不留历史）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-new
          git add -A
          git commit -m "state reset $(date -u +%F)"
          git push origin HEAD:data --force

      # 每月顺手清掉旧的 **Pages 部署记录**（用户 2026-10-09 要求）。
      # 背景：deploy-pages 每个成功的主跑都建一条 deployment，约 1 条/天、一年 300 多条，
      # 全都挂在这个仓库的 Environments → github-pages 列表里。**它不占仓库体积、
      # 不影响 Pages 站点**（站点内容由 Pages 服务持有，deployment 只是记录），
      # 纯粹是列表整洁 —— 而且 GitHub 的 retention 设置**不管 deployments**
      # （2026-10-01 那次扩大范围覆盖的是 checks / workflow runs / statuses /
      # artifact / 日志），所以只能自己删。
      # ⚠️ 删除有两条硬规则（REST API 文档）：仓库有多个 deployment 时**只能删
      #    inactive 的**，要先 POST 一个非 success 的 status 标成 inactive 再删；
      #    所以这里永远**跳过最新一条**（列表必须至少留一条）。
      # ⚠️ 失败**不判 job 红**（只用 ::warning:: 标注一下）：这是列表整洁类维护，
      #    删不掉几条记录不该去触发那个「失败就开 Issue」的告警。
      # 现在是 7 天（用户 2026-10-09 定）；想更保守就把 KEEP_DAYS 调大。
      - name: 清掉旧的 Pages 部署记录（留最新一条 + 只留最近 7 天）
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_DAYS: "7"
          TARGET_ENV: github-pages
        run: |
          set -u
          cutoff=$(date -u -d "-${KEEP_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          echo "将删除 ${TARGET_ENV} 环境下早于 ${cutoff} 的部署记录（最新一条永远保留）"
          if ! gh api --paginate \
                 "repos/${GITHUB_REPOSITORY}/deployments?environment=${TARGET_ENV}&per_page=100" \
                 --jq '.[] | "\(.id) \(.created_at)"' > /tmp/deps.raw 2>/tmp/deps.err; then
            echo "::warning::取部署列表失败，本次跳过清理；$(cat /tmp/deps.err)"
            exit 0
          fi
          tail -n +2 /tmp/deps.raw > /tmp/deps.txt   # 跳过最新一条
          pending=$(wc -l < /tmp/deps.txt)
          echo "该环境下待考察 ${pending} 条"
          deleted=0; failed=0
          while read -r id created; do
            [ -n "${id:-}" ] || continue
            [[ "${created:-}" < "${cutoff}" ]] || continue   # ISO8601 字典序即时序
            gh api -X POST "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" \
              -f state=inactive -f description="cleanup: superseded by a newer deploy" \
              >/dev/null 2>&1 || true
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/deployments/${id}" \
                 >/dev/null 2>&1; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
            fi
          done < /tmp/deps.txt
          echo "已删除 ${deleted} 条，失败 ${failed} 条（失败多为「系统保护的最后一条」，可忽略）"

  prefetch:
    # 批 B 预抓（.scratch/prefetch/spec.md R2）：15:14 Asia/Shanghai 补详情缓存，
    # 只写 state 不出报表；与主任务错开，防并发写坏 state.json。
    # S8 起**纯 state 派生**：不扫描折扣列表（省 ~27 次 ITAD/天），目标 =
    # 当日新增 ∪ 折扣活跃欠账 ∪ unlisted 重判 ∪ 只缺中文名，公式与主跑一致。
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '14 7 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write      # 状态回写 data 分支
    steps:
      - uses: actions/checkout@v7

      - name: 取出 data 分支（状态库持久层）
        uses: actions/checkout@v7
        with:
          ref: data
          path: statedata
          fetch-depth: 0   # 回写含 pull --rebase，同 daily（review-s8 P1-3）

      - name: 恢复状态文件
        uses: ./.github/actions/state-restore

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: pip install requests jinja2

      - name: 生成运行配置（key 走 secrets 环境变量，config.py 已支持覆盖）
        run: cp config.example.json config.json

      - name: 预抓详情（只写 state，不出报表）
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
        run: python run.py --prefetch

      - name: 状态回写 data 分支（§8 坑 3）
        if: always() && hashFiles('data/state.json') != ''
        uses: ./.github/actions/data-writeback
        with:
          message: "state (prefetch) $(date -u +%F)"

  alert:
    # S8 ②：任一 job 失败自动开 Issue（自包含、可追溯）。同一天同失败组合
    # 只开一个（按标题去重），避免连跑连开。
    # ⚠️ 只判 result == 'failure'，cancelled（手动取消 / 超时连带）不告警是有意的：
    # 取消是人主动行为或已被 timeout 说明，开 Issue 只会噪音（review-s8 P1-2 注）。
    needs: [daily-guard, daily, prefetch, cleanup-data-branch]
    if: >-
      always() && (
        needs.daily-guard.result == 'failure' ||
        needs.daily.result == 'failure' ||
        needs.prefetch.result == 'failure' ||
        needs.cleanup-data-branch.result == 'failure'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: 汇总失败 job 与退出码
        id: summary
        env:
          GUARD: ${{ needs.daily-guard.result }}
          DAILY: ${{ needs.daily.result }}
          PREFETCH: ${{ needs.prefetch.result }}
          CLEANUP: ${{ needs.cleanup-data-branch.result }}
          RUN_CODE: ${{ needs.daily.outputs.run_exit_code }}
        run: |
          failed=""
          for pair in "daily-guard ${GUARD}" "daily ${DAILY}" "prefetch ${PREFETCH}" "cleanup-data-branch ${CLEANUP}"; do
            set -- $pair
            if [ "$2" = "failure" ]; then failed="$failed $1"; fi
          done
          echo "jobs=$failed" >> "$GITHUB_OUTPUT"
          # 标题日期用北京时间（AGENTS.md：一律北京时间；主跑 03:14 CST = UTC 前一天，
          # 用 UTC 日期会让当天失败落到「昨天」标题上，去重语义也错位）
          echo "title=每日运行失败 $(TZ='Asia/Shanghai' date +%F)：$failed" >> "$GITHUB_OUTPUT"
          if [ -n "$RUN_CODE" ] && [ "$RUN_CODE" != "0" ]; then
            echo "code_line=run.py 退出码 \`$RUN_CODE\`" >> "$GITHUB_OUTPUT"
          fi

      - name: 开 Issue（当天同标题已开则跳过）
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.summary.outputs.title }}
          FAILED_JOBS: ${{ steps.summary.outputs.jobs }}
          CODE_LINE: ${{ steps.summary.outputs.code_line }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CRON: ${{ github.event.schedule }}
        run: |
          # ⚠️ 必须按**数值**比较：`--jq 'length'` 输出 "0"/"3" 都是非空字符串，
          # 用 `[ -n ... ]` 会恒真、永远走「跳过」分支（= 告警从未真正开出过 Issue）。
          count=$(gh issue list --search "in:title \"$TITLE\"" --state open --json number --jq 'length')
          if [ "${count:-0}" -gt 0 ]; then
            echo "今天已有同因失败 Issue（$TITLE），跳过重复创建"
            exit 0
          fi
          {
            echo "自动告警（S8 ②）：本次运行有 job 失败。"
            echo
            echo "- 运行：$RUN_URL"
            echo "- 触发：\`$EVENT_NAME\`$([ -n "$EVENT_CRON" ] && echo "（cron \`$EVENT_CRON\`）")"
            echo "- 失败 job：$FAILED_JOBS"
            [ -n "$CODE_LINE" ] && echo "- $CODE_LINE"
            echo
            echo "退出码口径：0 成功 · 1 未预期 · 2 配置 · 3 滥用封禁 · 4 请求失败（**仅报表产出前**，页面没更新）· **5 详情/覆盖阶段失败**（含请求失败；页面已兜底发布首版，欠账由下一轮派生自愈，无需人工救数据）"
            echo
            echo "排查指引：看上面运行里各 job 的 conclusion；\`daily-guard\` 失败会连坐补跑路径；"
            echo "\`guard 判 skip\` 是设计行为（补跑 cron 场次 12h 窗口），不会触发本告警。"
          } > body.md
          gh issue create --title "$TITLE" --body-file body.md
